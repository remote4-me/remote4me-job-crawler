name: Remote4Me Ashby Support Jobs

on:
  workflow_dispatch:
  schedule:
    # Daily at 7:00 PM India Standard Time (13:30 UTC)
    - cron: "30 13 * * *"

permissions:
  contents: read

concurrency:
  group: remote4me-ashby-scraper
  cancel-in-progress: false

jobs:
  ashby:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth

      - name: Run Ashby-only scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ASHBY_SEED_SLUGS: ${{ vars.ASHBY_SEED_SLUGS }}
          PYTHONUNBUFFERED: "1"
        run: python ashby_runner.py

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashby-run-log
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
