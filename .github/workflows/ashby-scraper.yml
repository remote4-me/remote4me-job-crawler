name: Remote4Me Ashby Support Jobs

on:
  # Run automatically after the existing daily crawler finishes. This ensures
  # its Boards registry has been refreshed before this Ashby-only pass starts.
  workflow_run:
    workflows: ["Remote4.me Job Crawler"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote4me-ashby-scraper
  cancel-in-progress: false

jobs:
  ashby:
    # Do not run on a failed/cancelled parent crawl. Manual runs remain available.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth

      - name: Run Ashby-only scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ASHBY_SEED_SLUGS: ${{ vars.ASHBY_SEED_SLUGS }}
          PYTHONUNBUFFERED: "1"
        run: python ashby_runner.py
